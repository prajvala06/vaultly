# Optional Zerops project import (Node.js API service).
# In Zerops Dashboard: Project → Import services → paste this YAML.
# Then connect GitHub and set secrets in the `vaultly` service env.

project:
  name: vaultly
  tags:
    - vaultly

services:
  - hostname: vaultly
    type: nodejs@22
    minContainers: 1
    maxContainers: 3
    ports:
      - port: 4000
        httpSupport: true
